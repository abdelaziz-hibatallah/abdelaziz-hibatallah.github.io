<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The EGO TaxTech | استشارة الخبير </title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --royal-green: #006233; --maghreb-gold: #c19b6c; --marble-white: #f4f7f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--marble-white); background-image: url('https://www.transparenttextures.com/patterns/arabesque.png'); }
        .moroccan-header { background: linear-gradient(135deg, var(--royal-green) 0%, #004d29 100%) !important; border-bottom: 6px solid var(--maghreb-gold); }
        .card-zellige { background: white !important; border-top: 6px solid var(--maghreb-gold) !important; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 25px; }
        .btn-copper { background-color: var(--maghreb-gold) !important; color: white !important; border-radius: 50px; font-weight: bold; transition: 0.3s; width: 100%; padding: 12px; }
        .btn-copper:hover { background-color: var(--royal-green) !important; transform: scale(1.02); }
        input, select, textarea { border-right: 4px solid var(--maghreb-gold) !important; padding: 10px; background: #f9f9f9; width: 100%; border-radius: 8px; margin-bottom: 15px; outline: none; }
        .page-content { display: none; }
        .active-page { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav class="moroccan-header p-5 text-white sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold font-amiri tracking-widest">THE EGO <span class="text-yellow-500">PRO</span></h1>
            <div class="flex gap-4 md:gap-8 text-sm">
                <button onclick="showPage('consultation')" class="hover:text-yellow-400">طلب استشارة</button>
                <button onclick="showPage('calculator')" class="hover:text-yellow-400">الحاسبة الذكية</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-10 max-w-4xl">
        
        <section id="consultation" class="page-content active-page">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-green-900 font-amiri">أرسل استشارتك للخبير الضريبي</h2>
                <p class="text-gray-500 mt-2">سيقوم الخبير بمراجعة وضعيتك والرد عليك عبر البريد الإلكتروني</p>
            </div>

            <div class="card-zellige">
                <form id="consultationForm">
                    <div class="grid md:grid-cols-2 gap-4">
                        <input type="text" id="userName" placeholder="الاسم الكامل" required>
                        <input type="email" id="userEmail" placeholder="بريدك الإلكتروني (للتواصل)" required>
                    </div>
                    
                    <div class="grid md:grid-cols-2 gap-4">
                        <select id="userRole" onchange="toggleCompanyInput()">
                            <option value="موظف">موظف (أجير)</option>
                            <option value="تاجر">تاجر / حرفي</option>
                            <option value="شركة">صاحب مقاولة (SARL/SA)</option>
                        </select>
                        <input type="text" id="companyName" placeholder="اسم المؤسسة / المحل" class="hidden">
                    </div>

                    <input type="text" id="iceNumber" placeholder="رقم ICE (اختياري لغير الشركات)">
                    <textarea id="userMessage" rows="5" placeholder="اشرح وضعيتك الضريبية أو سؤالك هنا بالتفصيل..." required></textarea>
                    
                    <button type="submit" class="btn-copper">إرسال الطلب الآن ۞</button>
                </form>
                <div id="statusMsg" class="mt-4 text-center hidden font-bold"></div>
            </div>
        </section>

        <section id="calculator" class="page-content">
            <div class="card-zellige">
                <h2 class="text-2xl font-bold mb-6 text-center text-green-900">محاكي الوضع الاقتصادي</h2>
                <input type="number" id="rev" placeholder="إجمالي المداخيل (درهم)">
                <input type="number" id="exp" placeholder="إجمالي المصاريف (درهم)">
                <button onclick="quickCalc()" class="btn-copper">تحليل فوري</button>
                <div id="calcRes" class="mt-6 p-4 rounded-xl text-center hidden"></div>
            </div>
        </section>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0E4YmwONbnFdVUGErQjjqO2onIUkfGI8",
            authDomain: "the-ego-taxtech.firebaseapp.com",
            projectId: "the-ego-taxtech",
            appId: "1:42792102209:web:e27de237be4c9eca5399c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تبديل الصفحات
        window.showPage = (id) => {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
        };

        // إظهار حقل اسم المؤسسة إذا كان المستخدم شركة
        window.toggleCompanyInput = () => {
            const role = document.getElementById('userRole').value;
            const compInput = document.getElementById('companyName');
            compInput.className = (role === 'شركة' || role === 'تاجر') ? "block" : "hidden";
        };

        // إرسال البيانات إلى Firebase Firestore (إليك أنت)
        document.getElementById('consultationForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const status = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";

            try {
                await addDoc(collection(db, "inquiries"), {
                    name: document.getElementById('userName').value,
                    email: document.getElementById('userEmail').value,
                    role: document.getElementById('userRole').value,
                    company: document.getElementById('companyName').value || "غير متوفر",
                    ice: document.getElementById('iceNumber').value || "غير متوفر",
                    message: document.getElementById('userMessage').value,
                    timestamp: serverTimestamp()
                });

                status.innerText = "تم إرسال طلبك بنجاح! سيتواصل معك الخبير قريباً.";
                status.className = "mt-4 text-center block text-green-700 font-bold";
                e.target.reset();
            } catch (error) {
                status.innerText = "حدث خطأ. يرجى المحاولة لاحقاً.";
                status.className = "mt-4 text-center block text-red-700 font-bold";
            }
            btn.disabled = false;
            btn.innerText = "إرسال الطلب الآن ۞";
        };

        // الحساب السريع
        window.quickCalc = () => {
            const r = parseFloat(document.getElementById('rev').value) || 0;
            const x = parseFloat(document.getElementById('exp').value) || 0;
            const p = r - x;
            const res = document.getElementById('calcRes');
            res.classList.remove('hidden');
            res.className = p >= 0 ? "mt-6 p-4 rounded-xl text-center bg-green-100 text-green-800 font-bold" : "mt-6 p-4 rounded-xl text-center bg-red-100 text-red-800 font-bold";
            res.innerHTML = `النتيجة المالية: ${p.toLocaleString()} درهم <br> الوضع الاقتصادي: ${p >= 0 ? 'إيجابي' : 'سلبي'}`;
        };
    </script>
</body>
</html>
