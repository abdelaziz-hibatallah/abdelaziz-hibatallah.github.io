<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The EGO AI | المنصة الوطنية للضرائب 2026</title>
    <meta name="description" content="منصة ذكية لحساب الضرائب والاستشارات القانونية في المغرب لعام 2026">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; }
        .moroccan-header { background: linear-gradient(135deg, #006233 0%, #004d29 100%); border-bottom: 5px solid #c19b6c; }
        .card-morocco { border-top: 4px solid #c19b6c; transition: transform 0.3s ease; }
        h1, h2 { font-family: 'Amiri', serif; }
    </style>
</head>
<body>
    <nav class="moroccan-header p-4 text-white shadow-2xl">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold uppercase">The EGO TaxTech 2026</h1>
            <div class="space-x-4 space-x-reverse hidden md:flex">
                <button onclick="showPage('company')" class="hover:text-yellow-500">الشركات</button>
                <button onclick="showPage('merchant')" class="hover:text-yellow-500">التجار</button>
                <button onclick="showPage('employee')" class="hover:text-yellow-500">الموظفين</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-6">
        <section id="company-page" class="page-content">
            <div class="grid md:grid-cols-3 gap-8">
                <div class="bg-white p-6 rounded-2xl shadow-lg card-morocco">
                    <h3 class="font-bold mb-4 italic text-green-800">حساب الضريبة على الشركات (IS)</h3>
                    <input type="number" id="profit" placeholder="الربح السنوي الصافي" class="w-full p-3 bg-gray-100 rounded mb-4 outline-none">
                    <button id="calcISBtn" class="w-full bg-green-800 text-white py-2 rounded">احسب الضريبة</button>
                    <p id="resIS" class="mt-4 font-bold"></p>
                </div>
                <div class="md:col-span-2 bg-slate-900 text-white p-6 rounded-2xl h-[400px] flex flex-col">
                    <div id="chatBox" class="flex-grow overflow-y-auto mb-4 text-sm">
                        <p class="text-blue-400 font-bold italic underline mb-4 inline-block">مستشار Gemini القانوني لعام 2026 في خدمتك...</p>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="aiInput" class="flex-grow p-3 bg-gray-800 rounded outline-none border border-gray-700" placeholder="اسأل عن قانون المالية...">
                        <button id="sendAI" class="bg-[#c19b6c] px-6 rounded font-bold">ارسل</button>
                    </div>
                </div>
            </div>
        </section>

        </main>

    <script type="module" src="main.js"></script>
</body>
</html>
