<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The EGO TaxTech | استشارة الخبير عبد العزيز</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --royal-green: #006233; --maghreb-gold: #c19b6c; --marble-white: #f4f7f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--marble-white); background-image: url('https://www.transparenttextures.com/patterns/arabesque.png'); }
        .moroccan-header { background: linear-gradient(135deg, var(--royal-green) 0%, #004d29 100%) !important; border-bottom: 6px solid var(--maghreb-gold); }
        .card-zellige { background: white !important; border-top: 6px solid var(--maghreb-gold) !important; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 20px; }
        .btn-copper { background-color: var(--maghreb-gold) !important; color: white !important; border-radius: 50px; font-weight: bold; transition: 0.3s; padding: 12px; width: 100%; }
        input, select, textarea { border-right: 4px solid var(--maghreb-gold) !important; padding: 12px; background: #f9f9f9; width: 100%; border-radius: 8px; margin-bottom: 15px; outline: none; border: 1px solid #ddd; }
        .page-content { display: none; }
        .active-page { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav class="moroccan-header p-5 text-white sticky top-0 z-50 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold font-amiri tracking-widest">THE EGO <span class="text-yellow-500">TAX PRO</span></h1>
            <div class="flex gap-4 md:gap-8 text-sm">
                <button onclick="showPage('calculator')" class="hover:text-yellow-400">حاسبة الضريبة</button>
                <button onclick="showPage('consultation')" class="hover:text-yellow-400">تواصل مع الخبير</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-10 max-w-5xl">
        
        <section id="calculator" class="page-content active-page">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-green-900 font-amiri italic">حاسبة الوضع الاقتصادي والضريبي</h2>
                <p class="text-gray-500 mt-2">حلل مداخيلك ومصاريفك بناءً على معايير 2026</p>
            </div>
            <div class="grid md:grid-cols-2 gap-8">
                <div class="card-zellige">
                    <h3 class="font-bold mb-4 text-green-800">📊 أدخل بياناتك المالية</h3>
                    <input type="number" id="rev" placeholder="إجمالي المداخيل السنوية (درهم)">
                    <input type="number" id="exp" placeholder="إجمالي المصاريف السنوية (درهم)">
                    <button onclick="calculateTax()" class="btn-copper">تحليل فوري ۞</button>
                </div>
                <div id="calcRes" class="card-zellige flex flex-col justify-center items-center text-center bg-gray-50 border-dashed border-2 border-gray-200">
                    <p class="text-gray-400 italic">أدخل البيانات لتظهر النتيجة هنا</p>
                </div>
            </div>
        </section>

        <section id="consultation" class="page-content">
            <div class="card-zellige max-w-2xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-center text-green-900">أرسل ملفك مباشرة للخبير عبد العزيز</h2>
                <form id="contactForm">
                    <div class="grid md:grid-cols-2 gap-4">
                        <input type="text" id="name" placeholder="اسمك الكامل" required>
                        <input type="email" id="email" placeholder="بريدك الإلكتروني" required>
                    </div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <select id="role">
                            <option value="موظف">أنا موظف (أجير)</option>
                            <option value="تاجر">أنا تاجر / مقاول ذاتي</option>
                            <option value="شركة">أنا صاحب شركة (ICE مطلوب)</option>
                        </select>
                        <input type="text" id="ice" placeholder="رقم الـ ICE (إن وجد)">
                    </div>
                    <textarea id="message" rows="4" placeholder="اكتب استشارتك هنا... سيظهر لي اسم مؤسستك ووضعك الحالي." required></textarea>
                    <button type="submit" class="btn-copper">إرسال لـ عبد العزيز ۞</button>
                </form>
                <div id="status" class="mt-4 text-center hidden font-bold"></div>
            </div>
        </section>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0E4YmwONbnFdVUGErQjjqO2onIUkfGI8",
            authDomain: "the-ego-taxtech.firebaseapp.com",
            projectId: "the-ego-taxtech",
            appId: "1:42792102209:web:e27de237be4c9eca5399c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // التنقل بين الصفحات
        window.showPage = (id) => {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
        }

        // حاسبة الضرائب (المحفوظة)
        window.calculateTax = () => {
            const r = parseFloat(document.getElementById('rev').value) || 0;
            const x = parseFloat(document.getElementById('exp').value) || 0;
            const profit = r - x;
            const tax = profit > 0 ? profit * 0.20 : 0; // افتراض نسبة 20% ضريبة
            const res = document.getElementById('calcRes');
            
            res.className = profit > 0 ? "card-zellige bg-green-50 border-green-200 text-green-800" : "card-zellige bg-red-50 border-red-200 text-red-800";
            res.innerHTML = `
                <h4 class="font-bold text-xl mb-2">التحليل المالي</h4>
                <p>الربح الصافي: ${profit.toLocaleString()} درهم</p>
                <p>الضريبة التقديرية (IS): ${tax.toLocaleString()} درهم</p>
                <div class="mt-3 font-bold uppercase tracking-widest">${profit > 0 ? 'الوضع إيجابي ✓' : 'الوضع سلبي ⚠️'}</div>
            `;
        }

        // إرسال البيانات لـ Firebase
        document.getElementById('contactForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const status = document.getElementById('status');
            btn.innerText = "جاري الإرسال...";

            try {
                await addDoc(collection(db, "messages"), {
                    sender_name: document.getElementById('name').value,
                    sender_email: document.getElementById('email').value,
                    sender_role: document.getElementById('role').value,
                    sender_ice: document.getElementById('ice').value || "غير مسجل",
                    content: document.getElementById('message').value,
                    time: serverTimestamp()
                });
                status.innerText = "وصلت رسالتك يا عبد العزيز بنجاح! راجع لوحة تحكم Firebase.";
                status.className = "mt-4 text-center block text-green-600";
                e.target.reset();
            } catch (err) {
                status.innerText = "خطأ: تأكد من تفعيل Firestore في Firebase.";
                status.className = "mt-4 text-center block text-red-600";
            }
            btn.innerText = "إرسال لـ عبد العزيز ۞";
        }
    </script>
</body>
</html>
